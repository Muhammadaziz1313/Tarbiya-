<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Document</title>
</head>
<style>
    *{
        font-family: Arial, Helvetica, sans-serif;
        margin: 0;
        padding: 0;
    }
    body{
        background-image: url(https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR0gJ7claInNlUMPZIlOJ7XEBnVKTlJAacQJRRmmUZQ9w&s=10);
        background-repeat: no-repeat;
        background-size: cover;
        height: 1000px;
    }
    .mainheader{
        background-color: rgb(8, 179, 82);
        width: 100%;
        height: 70px;
        padding: 10px;
        text-align: center;
    }
    .card{
        border: 1px solid black;
        width: 500px;
        height: 500px;
        border-radius: 20px;
        color: black;
        margin: 10px;
        text-align: center;
    }
  .card img{
        width: 500px;
        height: 500px;
        border-radius: 20px;
    }
  .card button{
        border: 1px solid  black;
        transition: transform 0.3s ease-out;
    }
  .card-wrapper{
        display: flex;
        flex-wrap: wrap;
    }
  .card button:hover{
        transform:  matrix(y,x)
    }
    .card h1, h3, h2, p{
        font-size: 20px;
    }
    .as{
        display: flex;
        justify-content: space-evenly;
    }
    .a1, .a2{
        text-decoration: none;
        color: black;
        font-size: 20px;
    }
</style>
<body>
    <header class="mainheader">
    <h1><i>Sergeli</i></h1>
    <div class="as">
    <a class="a1" href="#images">Rasmlar</a>
    <a class="a2" href="">Ma'lumot</a>  
    </div>
    </header>
    <section class="images">     
        <div class="card-wrapper">
            <div class="card">
                <div class="image-container">
                    <img src="./images/1.png" alt="Espresso">
                </div>
            </div>
             <div class="card-wrapper">
            <div class="card">
                <div class="image-container">
                    <img src="./images/2.png" alt="Espresso">
                </div>
            </div>
             </div>
        </div>
    </section>
</body>
</html>
